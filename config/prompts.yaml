templates:
  # FE-ALIGN P6: 资料库半自动派生 — 从归档正文提取候选实体/时间线事件（不直接入库，进待办确认）
  neutral_draft:
    version: "2026-08-20.v5"
    # A deterministic repair includes the rejected draft plus the same frozen
    # scene facts, so the drafting budget must hold draft + bundle twice over.
    # 24000 is the measured scene-family value (see the block above); the old
    # 2600/3200 pre-dated the one-token-per-CJK-character estimator and rejected
    # real repairs before provider dispatch. The scene-splitting guard for
    # genuinely oversized inputs is unchanged.
    input_token_budget: 24000
    system_prompt: |
      You are drafting a neutral, continuity-safe web-novel scene.
      Follow the supplied bundle facts exactly and preserve causal clarity.
      Return a complete scene, never a synopsis, excerpt, outline, or sample-sized fragment.
      The Scene Card target length band is a hard output constraint: estimate visible Chinese prose characters before returning and keep scene_text inside the band.
    task_prompt: |
      Write the next scene draft from the supplied bundle snapshot.
      Keep the prose neutral in style while honoring all explicit constraints.
      Cover every must-include constraint explicitly and satisfy the full target length band. If more development is needed, expand action-reaction beats, blocking, concrete consequences, and information release without inventing a new event.
      Treat Scene Literary Blueprint v2 as a readability proposal, not background summary: put visible_desire on the page, force forced_choice, make price_paid concrete, release information_release through action, and end on ending_action.
      If Longform Structure Guidance is present, treat it as editorial pressure for arc, promise, payoff, and information release; do not let it override hard facts in the chapter goal or scene card.
      If Character Pressure Blueprint is present, make the character's hidden fear, wrong belief, shame point, avoidance strategy, relationship debt, and current mask visible through action or omission.
      If Chapter Story Architecture is present, obey its promise, escalation path, reveal plan, payoff target, character shift, and ending question.
      Avoid model-voice shortcuts: no explanatory dialogue dump, no no-choice scene, no summary ending, and keep image anchors varied rather than repetitive.
      This is a structural draft, not a polished one: prioritize complete action-reaction beats and factual scaffolding over rhetorical flourish. The style pass will handle prose texture next, so resist reaching for vivid phrasing here — a plain sentence that lands the beat beats a decorated one that blurs it.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - scene_text
      properties:
        scene_text:
          type: string
        continuity_notes:
          type: array
          items:
            type: string

  hard_qc:
    version: "2026-07-04.v2"
    input_token_budget: 24000
    system_prompt: |
      You are a hard continuity and requirements checker for scene drafts.
      Fail any contradiction, missing hard constraint, or unsupported event.
    task_prompt: |
      Audit the scene draft against the bundle snapshot and return only structured findings.
      Use one legal outcome tuple only:
      hard_pass / true / pass,
      hard_fail_partial / false / partial_rewrite,
      hard_fail_full / false / full_rewrite,
      hard_block_human / false / human_review_required.
      Always include rewrite_brief; use an empty array when the draft passes.
      Each issue's message must name the specific passage or sentence it refers to and quote or closely paraphrase the offending text — do not state a category without pointing at where it occurs.
      Each rewrite_brief entry must name what to change and roughly how (for example: "restate paragraph 3's ending as an action, not a summary line"), not just restate what is wrong, since it feeds the rewrite branch directly.
      If you are not certain something is a genuine hard violation, do not report it — never manufacture issues to seem useful; a false positive blocks a scene that did not need it.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - resolution_code
        - pass_flag
        - next_action
        - issues
        - rewrite_brief
      properties:
        resolution_code:
          type: string
          enum:
            - hard_pass
            - hard_fail_partial
            - hard_fail_full
            - hard_block_human
        pass_flag:
          type: boolean
        next_action:
          type: string
          enum:
            - pass
            - partial_rewrite
            - full_rewrite
            - human_review_required
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - issue_key
              - message
            properties:
              issue_key:
                type: string
              message:
                type: string
        rewrite_brief:
          type: array
          items:
            type: string

  style_draft:
    version: "2026-08-20.v7"
    input_token_budget: 24000
    system_prompt: |
      You are drafting a stylistically tuned web-novel scene from a structured Style Feature Contract.
      Preserve bundle facts exactly, keep continuity safe, and apply reusable craft-level traits rather than copying any protected author.
      Return the complete rewritten scene, never a synopsis, excerpt, outline, or sample-sized fragment.
      The Scene Card target length band is a hard constraint: estimate visible Chinese prose characters before returning and keep scene_text inside it. Reference samples demonstrate style only; never imitate their length, content, names, or events.
    task_prompt: |
      Recompose the supplied source draft with stronger style adherence, without changing factual continuity. Treat the source as an immutable event-and-fact scaffold, not as prose to line-edit: do not preserve its sentence shapes, paragraph breaks, image sequence, diction, or rhetorical order when they conflict with the Style Reference blocks. Rebuild the prose from a blank page while preserving POV, names, chronology, required objects, causal steps, ending function, and every must-include fact.
      Cover every must-include constraint explicitly and satisfy the full target length band. If the source draft is too short, expand existing action-reaction beats, blocking, concrete consequences, and information release; do not add a new plot event.
      Preserve the Scene Literary Blueprint v2 pressure: visible_desire, forced_choice, price_paid, information_release, relationship_turn, image_anchor, ending_action, and next_scene_pull must remain legible in prose.
      If an Author Preference Profile section is present, obey the author's preferred revision moves and avoid the AI traces the author commonly rejects.
      If Longform Structure Guidance is present, use it as structural pressure for arc, payoff, and release timing; do not let it override hard continuity or scene-card facts.
      If Character Pressure Blueprint is present, preserve its hidden fear, wrong belief, shame point, avoidance strategy, relationship debt, and current mask as scene pressure rather than explanation.
      If Chapter Story Architecture is present, make the rewritten scene serve the chapter promise, reveal plan, payoff target, character shift, and ending question.
      Follow the Style Feature Contract dimension by dimension:
      - rhythm: sentence beat, pause placement, paragraph endings.
      - syntax: sentence length mix, clause shape, dialogue/narration texture.
      - imagery: recurring sensory fields, tactile anchors, gesture logic.
      - narrative_distance: POV closeness, interiority, exposition distance.
      - emotion_curve: how pressure rises, turns, and resolves inside the scene.
      - paragraph_density: block length, line-break frequency, compression level.
      - dialogue_ratio: spoken line share and silence around speech.
      Avoid all banned moves and keep calibration lines as tonal references, not text to copy.
      If a block headed 风格分布指导 is present, treat it as a soft description of the reference corpus rather than a quota. Rebuild paragraph and sentence rhythm at narrative-unit boundaries; never add punctuation, filler, or arbitrary line breaks merely to resemble a statistic. The source draft's paragraphing is explicitly non-authoritative.
      Guard against common mechanical AI-voice failures without overriding the reference's legitimate craft choices:
      - narrative-distance consistency: preserve the distance encoded by the reference and Scene Card POV; do not drift into generic omniscient explanation unless that distance is actually part of the reference style.
      - no redundant summary endings: a reflective close is allowed when the reference supports it, but it must add pressure, implication, or a new turn rather than restate what the paragraph already showed.
      - no as-you-know dialogue: characters must not explain to each other information they both already know purely to inform the reader.
      - intentional motifs only: recurring sensory images or metaphors may return when their meaning develops; do not recycle them as interchangeable atmospheric filler.
      - reference-faithful rhythm: preserve deliberate repetition or uniformity evidenced by the reference, while removing accidental runs of identical sentence templates.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - scene_text
      properties:
        scene_text:
          type: string
        style_notes:
          type: array
          items:
            type: string

  style_length_patch:
    version: "2026-08-20.v3"
    input_token_budget: 24000
    system_prompt: |
      You produce exact, minimal, segment-addressed edits for a Chinese novel scene whose reusable style and facts
      are already correct but whose visible-character count is outside a hard range. The labeled source contains
      synthetic segment markers such as ⟦S001⟧; those markers are addresses, not prose. Never rewrite, summarize,
      continue, or return the whole scene. Return only an allowed segment_id and its new_text. Preserve all required
      facts, chronology, names, POV, and the ending function. The caller will locate, apply, and validate every edit
      deterministically; you never need to copy source text as an address.
    task_prompt: |
      Return 1-6 edits using only segment IDs explicitly listed as editable in the dynamic contract. Never use the
      protected ending segment. For expansion, the caller preserves the selected segment and inserts new_text
      immediately after it; new_text must add concrete action-reaction, blocking, perception, or consequence in the
      same event. For compression, new_text replaces only the selected segment and must be shorter, deleting only
      repetition or decorative description while keeping adjacent prose grammatical. Use each segment_id at most
      once. Make the combined visible-character delta land inside the stated correction window. Do not put segment
      markers, ellipses, or placeholders in new_text. Do not include scene_text, copied source text, or commentary.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - edits
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
              - segment_id
              - new_text
            properties:
              segment_id:
                type: string
                pattern: "^S[0-9]{3}$"
              new_text:
                type: string
                maxLength: 1000

  style_salvage_patch:
    version: "2026-08-20.v1"
    input_token_budget: 24000
    system_prompt: |
      You perform one bounded, segment-addressed style salvage on an already approved Chinese novel scene after a
      complete style rewrite was rejected as extremely underlength. The labeled source contains synthetic markers
      such as ⟦S001⟧; they are addresses, not prose. Preserve the unselected source verbatim and never touch the
      protected ending segment. Rewrite exactly one allowed middle segment so it expresses the supplied reusable
      style mechanisms while preserving every fact, name, causal step, chronology, POV, and scene function.
    task_prompt: |
      Return exactly one edit with an allowed segment_id and replacement new_text. Keep new_text within the stated
      visible-character window for that segment. Do not summarize the whole scene, move events between segments,
      introduce new facts, quote reference prose, or include segment markers, ellipses, placeholders, copied source
      text, scene_text, or commentary. The caller will apply the replacement and validate facts, length, integrity,
      substantive change, and frozen-profile conformance deterministically.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - edits
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - segment_id
              - new_text
            properties:
              segment_id:
                type: string
                pattern: "^S[0-9]{3}$"
              new_text:
                type: string
                minLength: 20
                maxLength: 600

  soft_qc:
    version: "2026-07-04.v2"
    input_token_budget: 24000
    system_prompt: |
      You are a soft quality-control reviewer for prose polish and Style Feature Contract adherence.
      Focus on readability, cadence, emotional clarity, style-feature match, and whether the draft needs one controlled patch.
    task_prompt: |
      Review the draft for polish opportunities and return only structured soft QC guidance.
      Score style adherence from 0 to 1 using rhythm, syntax, imagery, narrative_distance, emotion_curve, paragraph_density, and dialogue_ratio.
      Also flag literary risks without blocking finalization: model_voice, image_homogeneity, expository_dialogue, no_choice_scene, summary_ending, weak choice_pressure, and weak ending_drive.
      If Longform Structure Guidance is present, check whether the draft meaningfully answers it while preserving scene-card facts.
      If style drift is patchable, put precise instructions in rewrite_brief and style_deviations.patch_brief.
      Use one legal outcome tuple only:
      soft_pass / true / pass,
      soft_patch / false / patch,
      soft_waive / true / pass_with_notes,
      soft_block_human / false / human_review_required.
      Each style_deviations entry's patch_brief must name the location (which paragraph or line), which of the literary risks above it corresponds to, and a concrete rewrite direction — not a vague instruction like "improve rhythm here".
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - resolution_code
        - pass_flag
        - next_action
        - issues
        - rewrite_brief
      properties:
        resolution_code:
          type: string
          enum:
            - soft_pass
            - soft_patch
            - soft_waive
            - soft_block_human
        pass_flag:
          type: boolean
        next_action:
          type: string
          enum:
            - pass
            - patch
            - pass_with_notes
            - human_review_required
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - issue_key
              - message
            properties:
              issue_key:
                type: string
              message:
                type: string
        rewrite_brief:
          type: array
          items:
            type: string
        carry_forward_note:
          type: boolean
        note_scope:
          type: string
        carry_note_text:
          type: string
        style_score:
          type: number
        style_dimensions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - score
              - evidence
            properties:
              name:
                type: string
              score:
                type: number
              evidence:
                type: string
        style_deviations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - dimension
              - severity
              - patch_brief
            properties:
              dimension:
                type: string
              severity:
                type: string
              patch_brief:
                type: string
              evidence:
                type: string

  chapter_summary:
    version: "2026-04-14.v1"
    input_token_budget: 1800
    system_prompt: |
      You are summarizing a completed chapter for future continuity use.
      Keep it factual, compressed, and easy to retrieve later.
    task_prompt: |
      Produce a compact chapter summary and carry-forward notes from the supplied bundle context.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - summary
        - carry_forward
      properties:
        summary:
          type: string
        carry_forward:
          type: array
          items:
            type: string

  continuity_compression:
    version: "2026-04-14.v1"
    input_token_budget: 1400
    system_prompt: |
      You are compressing continuity context for downstream drafting.
      Preserve hard facts, remove redundancy, and surface any split-scene recommendation clearly.
    task_prompt: |
      Compress the continuity payload while keeping essential carry-forward constraints intact.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - compressed_context
        - split_scene_recommended
      properties:
        compressed_context:
          type: string
        dropped_sections:
          type: array
          items:
            type: string
        split_scene_recommended:
          type: boolean

  style_ref_paragraph_classify_anchor:
    version: "2026-07-04.v2"
    input_token_budget: 2400
    system_prompt: |
      你是中文叙事段落分类专家。给定一批段落,逐段判断其类型,从 8 类中严格选择一个:
      dialogue / narration / psychology / description_env / description_char / action / transition / flashback。
      判断原则见 task_prompt。本任务是锚定集的强模型分类,作为后续快模型校准的基准。
    task_prompt: |
      8 类定义:
        1. dialogue          含明确引号或"……说""……道"
        2. narration         全知视角推进剧情的散文体段落
        3. psychology        内心活动、回忆、内省(典型词:想着/觉得/暗忖/恍惚)
        4. description_env   刻画场所、天气、自然或物件
        5. description_char  刻画外貌、衣着、神态
        6. action            连续动作动词
        7. transition        场景切换/时间跳跃句(通常短)
        8. flashback         对过去事件的追述(典型词:记得/那年/从前)
      规则:一段只归一类,多种特征以主导(>50%)为准;含直接引语优先 dialogue;短段(<30 字)且无对话/心理标识默认 transition。
      边界判例(常见混淆,按此裁决):
        - 对白夹叙述:看该段主要在推进什么——核心是动作/场景变化判 narration 或 action,核心是人物开口说话判 dialogue。
        - 诗句/歌谣等韵文插入:用于渲染环境氛围判 description_env,是人物内心吟诵/回忆的一部分判 psychology,不要另立新类别。
        - 书信体/日记体段落:第一人称自述背景或情感判 psychology,只是转述信件里的事件经过判 narration。
      仅看当前段本身,不考虑上下文。
      完整性要求:输入给你的每一个 paragraph_index 都必须在 classifications 里出现恰好一次,不得跳过、不得合并、不得新增不存在的 index。
      输出 JSON: { "classifications": [ {"paragraph_index": int, "paragraph_type": str, "confidence": "high"|"medium"|"low"}, ... ] }
    structured_schema: &paragraph_classify_schema
      type: object
      additionalProperties: false
      required:
        - classifications
      properties:
        classifications:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - paragraph_index
              - paragraph_type
              - confidence
            properties:
              paragraph_index:
                type: integer
              paragraph_type:
                type: string
                enum:
                  - dialogue
                  - narration
                  - psychology
                  - description_env
                  - description_char
                  - action
                  - transition
                  - flashback
              confidence:
                type: string
                enum: [high, medium, low]

  style_ref_paragraph_classify_bulk:
    version: "2026-07-04.v2"
    input_token_budget: 2400
    system_prompt: |
      你是中文叙事段落分类专家。给定一批段落,逐段判断其类型,从 8 类中严格选择一个:
      dialogue / narration / psychology / description_env / description_char / action / transition / flashback。
      本任务是 bulk 路径的快模型分类,在锚定集 agreement ≥ 0.85 时启用。
    task_prompt: |
      8 类定义:
        1. dialogue          含明确引号或"……说""……道"
        2. narration         全知视角推进剧情的散文体段落
        3. psychology        内心活动、回忆、内省(典型词:想着/觉得/暗忖/恍惚)
        4. description_env   刻画场所、天气、自然或物件
        5. description_char  刻画外貌、衣着、神态
        6. action            连续动作动词
        7. transition        场景切换/时间跳跃句(通常短)
        8. flashback         对过去事件的追述(典型词:记得/那年/从前)
      规则:一段只归一类,多种特征以主导(>50%)为准;含直接引语优先 dialogue;短段(<30 字)且无对话/心理标识默认 transition。
      边界判例:对白夹叙述看"主要推进什么"(动作/场景变化判 narration 或 action,人物开口判 dialogue);诗句渲染环境判 description_env、人物内心吟诵判 psychology;书信体自述背景判 psychology、转述事件判 narration。
      仅看当前段本身,不考虑上下文。
      完整性要求:输入给你的每一个 paragraph_index 都必须在 classifications 里出现恰好一次,不得跳过、不得合并、不得新增不存在的 index。
      输出 JSON: { "classifications": [ {"paragraph_index": int, "paragraph_type": str, "confidence": "high"|"medium"|"low"}, ... ] }
    structured_schema: *paragraph_classify_schema

  style_ref_extract_language:
    version: "2026-08-19.v5"
    input_token_budget: 3000
    system_prompt: |
      你是中文叙事风格抽取专家。给定一个 sub_dimension(如 language.rhetoric)
      与一批段落,产出该 sub_dimension 下的:
        - observations(正向特征,通常 3-6 条;样本确实高度匮乏时可以更少,但 0 条应是罕见例外而非默认结果)
        - forbidden_patterns(反向禁忌,0-2 条,允许为空)
      下列硬指标已对全文计算完毕,你提取的 observation 必须与之一致;
      若你的描述与硬指标矛盾,以硬指标为准重新组织语言。
      约束:
      - 每条 observation / forbidden_pattern 必须 ≥ 2 evidence;每条 evidence 引用
        paragraph_id + span + 原文 quote(quote 必须是段落原句,不允许改写)
      - 每条 evidence.quote 必须是某一个给定 paragraphs[].text 中单段、连续、逐字一致的
        子串,paragraph_id 必须原样复制该段 ID。严禁拼接不相邻短语、摘要式删节或自行增删
        标点;原文没有省略号时,quote 中也不得添加“……”或"..."。若填写 span,它必须是
        给定 text 上从 0 开始、左闭右开的 [start,end),且 text[start:end] 必须等于 quote
      - 严禁使用空泛形容词(如"文笔优美""画面感强""叙事流畅"等),要用具体、可
        被验证的写作机制描述
      - statement 只写可迁移的抽象机制,不得引用、复述或举例展示参考原文;
        任何原文字词只允许出现在 evidence.quote
      - 每条 quote 只截取足以证明机制的一小段连续原文,建议 15-80 字、绝不超过 160 字;
        statement 不超过 120 字。不要输出 note,illustrates_dims 等非必需可选字段
      - forbidden_pattern 描述作者明确不会用的写作模式(反向写作习惯);evidence 可以是
        paragraph_quote / author_avoidance(统计反推)/ counter_example(LLM 合成反例)
    task_prompt: |
      输入 payload 含 sub_dimension / metrics_anchor / paragraphs。
      请按 schema 输出 observations 与 forbidden_patterns。
      句法节奏、词汇质感、修辞、对白语言这类特征在给定的段落量下几乎总能找到,请逐段认真比对后再判断是否"找不到"。
      若某条 observation 确实证据不足或不典型,不要输出它;但不要把"不足 3 条"当作安全的默认结果,那通常说明分析还不够仔细。
      不要为凑数而编造证据,也不要降低"quote 必须是段落原句"的标准。
    structured_schema: &extract_output_schema
      type: object
      additionalProperties: false
      required:
        - observations
        - forbidden_patterns
      properties:
        observations:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [statement, finding_kind, evidence, sub_dimension]
            properties:
              statement:
                type: string
                maxLength: 180
              confidence:
                type: string
                enum: [high, medium, low]
              finding_kind:
                type: string
                enum: [observation]
              sub_dimension:
                type: string
              evidence:
                type: array
                minItems: 2
                items: &extract_evidence_schema
                  type: object
                  additionalProperties: false
                  required: [quote]
                  properties:
                    paragraph_id:
                      type: string
                    span:
                      type: array
                      items: {type: integer}
                      minItems: 2
                      maxItems: 2
                    quote:
                      type: string
                      maxLength: 160
                    illustrates_dims:
                      type: array
                      items: {type: string}
                    anchor_kind:
                      type: string
                      enum: [paragraph_quote, author_avoidance, counter_example]
                    note:
                      type: string
                    is_synthetic:
                      type: integer
        forbidden_patterns:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [statement, finding_kind, evidence, sub_dimension]
            properties:
              statement: {type: string, maxLength: 180}
              confidence:
                type: string
                enum: [high, medium, low]
              finding_kind:
                type: string
                enum: [forbidden_pattern]
              sub_dimension: {type: string}
              evidence:
                type: array
                minItems: 2
                items: *extract_evidence_schema

  style_ref_extract_narrative:
    version: "2026-08-19.v5"
    input_token_budget: 3000
    system_prompt: |
      你是中文叙事风格抽取专家(叙事层)。给定一个 sub_dimension(如
      narrative.pacing)与一批段落,产出该 sub_dimension 下的
      observations(正向特征,通常 3-6 条;样本确实高度匮乏时可以更少,但 0 条应是罕见例外而非默认结果)
      与 forbidden_patterns(反向禁忌,0-2 条,允许为空)。
      约束与 style_ref_extract_language 一致;尤其注意叙事层关心视角(perspective)、
      节奏(pacing)、时间处理(time_handling)、信息密度(information_density)。
      叙事层容易写成"张弛有度"式的空泛结论——每条 observation 必须绑定一个具体、可指认的
      叙事决策点(如在哪一类节点切换视点、在哪种场景压缩或拉长时间、信息在何时释放给读者),
      而不是笼统描述整体印象。
      每条 evidence.quote 必须是某一个给定 paragraphs[].text 中单段、连续、逐字一致的子串,
      paragraph_id 原样复制该段 ID;严禁拼接不相邻短语或添加原文没有的省略号。若填写 span,
      使用给定 text 上从 0 开始、左闭右开的 [start,end),并保证 text[start:end] == quote。
      statement 只写可迁移的抽象机制,不得引用、复述或举例展示参考原文;
      任何原文字词只允许出现在 evidence.quote。
      每条 quote 建议 15-80 字、绝不超过 160 字,statement 不超过 120 字;
      不要输出 note,illustrates_dims 等非必需可选字段。
    task_prompt: |
      输入 payload 含 sub_dimension / metrics_anchor / paragraphs。
      请按 schema 输出 observations 与 forbidden_patterns。
      视角、节奏、时间处理、信息密度这类特征在给定的段落量下几乎总能找到具体决策点,请逐段认真比对后再判断是否"找不到"。
      若某条 observation 确实证据不足或不典型,不要输出它;但不要把"不足 3 条"当作安全的默认结果。
      不要为凑数而编造证据,也不要降低"quote 必须是段落原句"的标准。
    structured_schema: *extract_output_schema

  style_ref_extract_scene:
    version: "2026-08-19.v5"
    input_token_budget: 3000
    system_prompt: |
